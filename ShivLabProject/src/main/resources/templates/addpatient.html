
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Patient | Shiv Lab</title>

    <link rel="stylesheet" th:href="@{/css/addpatient.css}">
</head>

<body>

    <div class="page-container">

        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">✚</span>
                <div>
                    <h2>Shiv Lab</h2>
                    <p>Pathology Laboratory</p>
                </div>
            </div>

            <a th:href="@{/report}" class="home-link">
                ← Home
            </a>
        </header>

        <!-- Main Content -->
        <main class="main-content">

            <div class="form-card">

                <div class="form-header">
                    <div class="icon-box">🏥</div>
                    <h1>Add New Patient</h1>
                    <p>Enter patient details to register a new patient.</p>
                </div>

                <!-- Success Message -->
                <div th:if="${message}" class="success">
                    <span>✓</span>
                    <p th:text="${message}">
                        Data Saved Successfully!
                    </p>
                </div>

                <!-- Patient Form -->
                <form th:action="@{/savePatient}"
                      th:object="${patient}"
                      method="post"
                      class="form-box">

                    <div class="form-group">
                        <label for="name">Patient Name</label>
                        <input type="text"
                               id="name"
                               th:field="*{name}"
                               placeholder="Enter patient name"
                               required>
                    </div>

                    <div class="form-row">

                        <div class="form-group">
                            <label for="age">Age</label>
                            <input type="number"
                                   id="age"
                                   th:field="*{age}"
                                   placeholder="Enter age"
                                   min="0"
                                   max="120"
                                   required>
                        </div>

                        <div class="form-group">
                            <label for="gender">Gender</label>
                            <select id="gender" th:field="*{gender}" required>
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>

                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel"
                               id="phone"
                               th:field="*{phone}"
                               placeholder="Enter phone number"
                               pattern="[0-9]{10}"
                               maxlength="10"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="type">Patient Type / Referred By</label>
                        <select id="type" th:field="*{type}" required>
                            <option value="">Select Type</option>
                            <option value="Self">Self</option>
                            <option value="Dr.Joshi">Dr. Joshi</option>
                            <option value="Dr.Dhavale">Dr. Dhavale</option>
                            <option value="Dr.Khatke">Dr. Khatke</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="status">Patient Status</label>
                        <select id="status" th:field="*{status}" required>
                            <option value="Active">Active</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>

                    <!-- Buttons -->
                    <div class="button-group">

                        <button type="submit" class="save-btn">
                            ✓ Save Patient
                        </button>

                        <a th:href="@{/report}" class="cancel-btn">
                            Home Page
                        </a>

                    </div>

                </form>

                <div class="footer-note">
                    Shiv Lab Patient Management System
                </div>

            </div>

        </main>

    </div>

</body>
</html>
